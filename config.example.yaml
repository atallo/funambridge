# Ejemplo de configuración de funambridge.
# El fichero real es config.yaml (excluido de git). Normalmente se gestiona
# desde el panel web, no a mano. En Docker, móntalo en /data/config.yaml.
# Lee tal cual los config.yaml de las versiones 0.x (Python).

server:
  host: 0.0.0.0       # un único puerto: WebDAV + panel web.
  port: 9000          # 0.0.0.0 = accesible desde tu LAN / red Docker.

admin:
  enabled: true       # pon false para deshabilitar el panel /_admin.

# Log extendido (DEBUG, rotado 5 MB x 3). "" = solo consola.
log_file: ""          # p.ej. /data/funambridge.log

# TLS integrado opcional, para clientes WebDAV que exigen HTTPS sin un proxy
# TLS delante. Si das cert+key y no existen, se generan autofirmados (en el
# cliente, marca "aceptar certificado no fiable").
tls:
  cert: ""    # p.ej. /data/funambridge-cert.pem
  key: ""     # p.ej. /data/funambridge-key.pem

# Disco de trabajo: el cuerpo de cada PUT mientras se sube a O2 (permite
# reanudar una subida cortada sin pedírsela otra vez al cliente; hasta 16 MB va
# en memoria) y la parte de la caché de escritura que no cabe en memoria
# (256 MB). "" = directorio temporal del sistema. En Docker, un subdirectorio
# del volumen.
cache_dir: ""   # p.ej. /data/cache

# O2 cierra la sesión web tras ~1-2 h sin peticiones (desde nov. 2026). El
# proxy hace una petición ligera por cuenta cada N minutos. 0 = desactivado.
keepalive_minutes: 5

# Transferencias simultáneas contra O2. 0 = sin límite (por defecto).
transfers:
  max_uploads: 0
  max_downloads: 0

# false (por defecto): todo se sube como fichero genérico, tal cual.
# true: las fotos, vídeos y audio se declaran como tales (O2 puede procesarlos).
upload_as_media: false

accounts:
  - name: personal
    base_url: https://cloud.o2online.es
    access_key: O2XXXXXXXXXXXXXXXXXX      # usuario WebDAV (regenerar/fijar desde el panel)
    secret_key: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx   # contraseña WebDAV
    device_id: web-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx         # dispositivo de la sesión de O2
    cache_seconds: 15                      # caché de escritura tras subir (segundos; 0 = off)
    # Se rellena al iniciar sesión (SMS desde el panel, HAR o cookies).
    oauth: {accesstoken: "", refreshtoken: "", platform: web, expiresin: "",
            lastrefreshdate: 0, msisdn: "", captured_at: ""}
    session: {jsessionid: "", validationkey: "", plc: "", captured_at: ""}
